name: Auto-merge

# Fusionne seule une PR d'agent quand c'est sans risque : CI verte, « Revue de
# code : OK » (+ « QA : OK » si l'interface change) plus récents que le dernier
# commit, aucun fichier sensible. Règles : GabinSMD/shared-workflows.
# ÉTEINT tant que la variable de dépôt AUTO_MERGE ne vaut pas « on » : le run
# ne fait qu'écrire dans son résumé ce qu'il fusionnerait.
#
# Pas de déploiement après une fusion automatique (deploy.yml met la
# production à jour) : le code fusionné part en production à la prochaine
# fusion manuelle ou par « Run workflow » sur Deploy. Pour l'automatiser,
# ajouter `after-merge-dispatch: deploy.yml`.

on:
  schedule:
    - cron: "7,37 * * * *"
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: write
      pages: write
    uses: GabinSMD/shared-workflows/.github/workflows/auto-merge.yml@main
    with:
      enabled: ${{ vars.AUTO_MERGE == 'on' }}
      # Toujours un humain : serveur (données des clubs, synchro, sécurité),
      # déploiement, scripts d'admin, session, licences (données personnelles).
      sensitive-paths: |
        server/
        deploy/
        scripts/
        fly.toml
        render.yaml
        client/src/lib/session.ts
        client/src/sync/
        shared/src/engine/licen*
      ui-paths: |
        client/
